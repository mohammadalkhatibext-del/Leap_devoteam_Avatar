<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Devoteam — LEAP</title>
    <link rel="icon" href="/brand/devoteam-color.svg" />
    <!-- Set the surface before first paint so the booth never flashes the wrong theme. -->
    <script>
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("devoteam-theme") || "dark",
      );
    </script>
    <style>
      /* `min-height`, not `height`: on a short screen a fixed height silently clips
         the log and sources cards instead of letting the page scroll. The booth panel
         is tall, but the laptop it gets configured on is not. */
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(330px, 0.7fr);
        gap: 20px;
        min-height: calc(100vh - 130px);
      }
      @media (max-width: 1040px) {
        .layout { grid-template-columns: 1fr; }
      }
      /* Keep the avatar looking like a person rather than a letterbox when the
         column is much taller or shorter than the video. */
      .stage { min-height: 420px; aspect-ratio: 16 / 10; }

      /* `.card.stage`, not `.stage`: style.css is imported from main.js and so lands
         after this block, which means a bare `.stage` loses to `.card` on order and
         the video area renders as a light panel — with white placeholder text on it,
         invisible. The stage is always black because it is video, in either theme. */
      .card.stage {
        border-radius: var(--radius-hero);
        background: #000;
        border-color: transparent;
        position: relative;
        overflow: hidden;
        padding: 0;
      }
      video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .placeholder {
        position: absolute; inset: 0; display: grid; place-items: center;
        color: rgba(255,255,255,.72); font-size: .9rem; text-align: center; padding: 24px;
      }

      /* Subtitles over the video: a hall is loud, and some visitors will read
         rather than hear. */
      .subtitle {
        position: absolute; inset-inline: 0; bottom: 0;
        padding: 20px 28px 26px; color: #fff;
        background: linear-gradient(to top, rgba(0,0,0,.9), rgba(0,0,0,0));
        font-size: 1.35rem; line-height: 1.5; min-height: 96px;
      }
      .subtitle:empty { background: none; }

      .badge {
        position: absolute; inset-inline-start: 18px; top: 18px;
        display: inline-flex; align-items: center; gap: 8px;
        font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
        padding: 6px 12px; border-radius: 999px;
        background: rgba(0,0,0,.6); color: rgba(255,255,255,.8);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #777; }
      .dot.live { background: var(--dv-fresh-mint); }
      .dot.busy { background: var(--dv-intense-fire); }

      .side { display: flex; flex-direction: column; gap: 16px; min-height: 0; }

      /* Push-to-talk is the primary control, so it gets the size and the brand
         colour; typing is the fallback for a hall too loud to speak over. */
      .talk {
        width: 100%; margin-top: 18px; padding: 18px 20px;
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        font-size: 1.1rem; background: var(--dv-poppy); border-radius: var(--radius-card);
      }
      .talk:hover:not(:disabled) { background: #e33a51; }
      .talk.listening { background: var(--dv-fresh-mint); color: #06281c; }
      .meter { width: 100%; height: 5px; border-radius: 3px; background: rgba(0,0,0,.28); overflow: hidden; }
      .meter i { display: block; height: 100%; width: 0%; background: #fff; transition: width .08s linear; }

      .suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      .suggest button {
        font-size: .85rem; font-weight: 400; padding: 7px 13px;
        background: var(--surface-2); color: var(--text); border: 1px solid var(--border-soft);
      }
      .suggest button:hover { background: var(--surface-sunken); }

      .panel { flex: 1; min-height: 0; overflow-y: auto; }
      .cite { border-inline-start: 3px solid var(--dv-poppy); padding: 2px 12px; margin-bottom: 14px; }
      .cite b {
        display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
        color: var(--dv-poppy); font-weight: 700; margin-bottom: 3px;
      }
      .cite span { font-size: .82rem; color: var(--text-muted); }
    </style>
  </head>
  <body>
    <header class="topbar">
      <img class="logo" data-logo src="/brand/devoteam-color-on-dark.svg" alt="Devoteam" />
      <div>
        <h1 data-t="title">مساعد ديفوتيم</h1>
        <div class="where" data-t="subtitle">LEAP — الرياض</div>
      </div>
      <div class="spacer"></div>
      <button class="chip" id="langBtn" data-t="switchLang">English</button>
      <button class="chip" id="themeBtn">◐</button>
      <a class="chip" id="adminLink" href="/admin.html" data-t="admin">الإعدادات</a>
    </header>

    <div class="layout">
      <div class="card stage">
        <div class="badge"><span class="dot" id="dot"></span><span id="state" data-t="notConnected">غير متصل</span></div>
        <video id="avatar" autoplay playsinline></video>
        <div class="placeholder" id="placeholder"></div>
        <div class="subtitle" id="subtitle"></div>
      </div>

      <div class="side">
        <div class="card">
          <div class="row">
            <button id="connect" data-t="connect">تشغيل</button>
            <button id="interrupt" class="secondary" data-t="stopSpeaking" disabled>إيقاف الكلام</button>
            <button id="reset" class="secondary" data-t="newVisitor" disabled>زائر جديد</button>
          </div>

          <button id="talk" class="talk" disabled>
            <span id="talkLabel" data-t="talk">🎤 اضغط وتحدّث</span>
            <span class="meter"><i id="meterFill"></i></span>
          </button>

          <label for="q" style="margin-top: 18px" data-t="orType">أو اكتب سؤالك</label>
          <input id="q" type="text" data-t-placeholder="placeholder" autocomplete="off" disabled />

          <div class="suggest" id="suggest"></div>
        </div>

        <div class="card panel">
          <div class="label" data-t="sources">المصادر</div>
          <div id="citations"></div>
        </div>

        <div class="card">
          <div class="label" data-t="log">سجل</div>
          <div id="log"></div>
          <div class="metrics" id="metrics"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
